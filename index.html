<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>איפה אני</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="איפה אני">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #0f172a; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
  #info { padding: 16px; display: flex; gap: 12px; flex-wrap: wrap; background: #1e293b; }
  .card { flex: 1; min-width: 140px; background: #334155; border-radius: 12px; padding: 12px 16px; }
  .label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .value { font-size: 20px; font-weight: 600; }
  #temp { font-size: 32px; }
  #map { flex: 1; }
  #status { padding: 8px 16px; font-size: 13px; color: #fbbf24; background: #1e293b; }
  #ride { padding: 0 16px 16px; background: #1e293b; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #rideBtn { flex: 0 0 auto; border: 0; border-radius: 12px; padding: 14px 18px; font: inherit; font-size: 16px; font-weight: 700; color: #0f172a; background: #4ade80; cursor: pointer; }
  #rideBtn.on { background: #f87171; }
  #rideStats { flex: 1; display: none; gap: 8px; min-width: 220px; }
  #rideStats.show { display: flex; }
  #rideStats > div { flex: 1; background: #334155; border-radius: 10px; padding: 6px 8px; text-align: center; }
  #rideStats .value { font-size: 17px; }
  #rideStats .label { margin: 0; font-size: 11px; }
  #rideNote { width: 100%; font-size: 12px; color: #94a3b8; display: none; }
  .locate-btn { width: 40px; height: 40px; font-size: 20px; line-height: 40px; text-align: center; background: #fff; color: #0f172a; cursor: pointer; border-radius: 4px; }
  .locate-btn.active { background: #38bdf8; }
  body.maponly #info { display: none; }
  .search-box { display: flex; background: #fff; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
  .search-box input { border: 0; padding: 9px 10px; font: inherit; font-size: 15px; width: 170px; background: transparent; color: #0f172a; outline: none; }
  .search-box button { border: 0; background: none; padding: 0 10px; font-size: 16px; cursor: pointer; }
  .trail-msg { cursor: pointer; background: rgba(15,23,42,.85); color: #f1f5f9; padding: 5px 10px; border-radius: 8px; font-size: 12px; display: none; margin-bottom: 22px !important; }
  .trail-popup { direction: rtl; text-align: right; font-size: 13px; line-height: 1.5; }
  .trail-popup b { font-size: 14px; }
  .trail-sat { width: 250px; height: 160px; border-radius: 8px; margin: 6px 0; background: #1e293b; }
  .trail-photos { display: flex; gap: 6px; overflow-x: auto; margin-top: 6px; min-height: 20px; color: #64748b; font-size: 12px; }
  .trail-photos img { height: 90px; border-radius: 6px; display: block; }
</style>
</head>
<body>
  <div id="info">
    <div class="card"><div class="label">טמפרטורה</div><div class="value" id="temp">--°</div></div>
    <div class="card"><div class="label">מיקום</div><div class="value" id="place">מחפש...</div></div>
    <div class="card"><div class="label">קואורדינטות</div><div class="value" id="coords" style="font-size:15px">--</div></div>
    <div class="card"><div class="label">דיוק</div><div class="value" id="acc" style="font-size:15px">--</div></div>
  </div>
  <div id="status">מבקש גישה למיקום...</div>
  <div id="ride">
    <button id="rideBtn">🚴 התחל רכיבה</button>
    <div id="rideStats">
      <div><div class="value" id="rDist">0.00</div><div class="label">ק״מ</div></div>
      <div><div class="value" id="rTime">0:00</div><div class="label">זמן</div></div>
      <div><div class="value" id="rSpeed">0</div><div class="label">קמ״ש</div></div>
      <div><div class="value" id="rAvg">0</div><div class="label">ממוצע</div></div>
    </div>
    <div id="rideNote">המסך יישאר דלוק בזמן רכיבה. אם סוגרים את האפליקציה, הרכיבה נשמרת וממשיכה כשחוזרים.</div>
  </div>
  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([32.0853, 34.7818], 13);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  });
  const cyclosm = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
    maxZoom: 20, attribution: '&copy; OpenStreetMap, CyclOSM'
  }).addTo(map);
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxZoom: 17, attribution: '&copy; OpenStreetMap, OpenTopoMap (CC-BY-SA)'
  });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Imagery &copy; Esri'
  });
  const bikeRoutes = L.tileLayer('https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png', {
    maxZoom: 18, opacity: 0.8, attribution: '&copy; waymarkedtrails.org'
  });
  const mtbRoutes = L.tileLayer('https://tile.waymarkedtrails.org/mtb/{z}/{x}/{y}.png', {
    maxZoom: 18, opacity: 0.85, attribution: '&copy; waymarkedtrails.org'
  }).addTo(map);
  const trails = L.layerGroup().addTo(map);
  L.control.layers(
    { 'מפת אופניים': cyclosm, 'שטח וגבהים': topo, 'לוויין': satellite, 'מפה רגילה': osm },
    { 'שבילי שטח (לחיצים)': trails, 'מסלולי MTB מסומנים': mtbRoutes, 'מסלולי אופניים': bikeRoutes }
  ).addTo(map);

  // ---- שבילי שטח מ-OpenStreetMap: שבילים ודרכי עפר, צבועים לפי רמת קושי ----
  const TRAIL_MIN_ZOOM = 13;
  const mtbColors = ['#16a34a', '#2563eb', '#dc2626', '#111827', '#111827', '#111827', '#111827'];
  const mtbNames = ['קל מאוד', 'קל', 'בינוני', 'קשה', 'קשה מאוד', 'אקסטרים', 'אקסטרים'];
  const highwayNames = { path: 'שביל', track: 'דרך עפר', bridleway: 'שביל רכיבה', cycleway: 'שביל אופניים' };
  const surfaceNames = { dirt: 'עפר', ground: 'אדמה', gravel: 'חצץ', fine_gravel: 'חצץ דק', sand: 'חול', rock: 'סלע', grass: 'דשא', mud: 'בוץ', asphalt: 'אספלט', paved: 'סלול', compacted: 'כבוש', unpaved: 'לא סלול', pebblestone: 'חלוקים', wood: 'עץ' };
  let trailsGen = 0, trailsTimer = null;
  // כמה שרתים, כי השרת הראשי עמוס לפעמים
  const OVERPASS_SERVERS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];

  // שולח לשרת הראשון; אם אין תשובה תוך 3 שניות (או שהוא נכשל) מנסה במקביל גם את הבא.
  // התשובה הראשונה שמגיעה מנצחת.
  function overpass(query) {
    return new Promise((resolve, reject) => {
      const ctrls = [];
      let next = 0, failed = 0, done = false, lastErr = '', hedge = null;
      const finish = () => { done = true; clearTimeout(hedge); ctrls.forEach(c => c.abort()); };
      const fail = err => {
        lastErr = err;
        if (++failed === OVERPASS_SERVERS.length) { finish(); reject(new Error(lastErr)); }
        else launch();
      };
      function launch() {
        if (done || next >= OVERPASS_SERVERS.length) return;
        const url = OVERPASS_SERVERS[next++];
        const ctrl = new AbortController();
        ctrls.push(ctrl);
        const timer = setTimeout(() => ctrl.abort(), 25000);
        clearTimeout(hedge);
        hedge = setTimeout(launch, 3000);
        fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(query),
          signal: ctrl.signal
        })
          .then(r => r.ok ? r.json() : Promise.reject(r.status))
          .then(d => { if (!done) { finish(); resolve(d); } })
          .catch(e => { if (!done) fail(e && e.name === 'AbortError' ? 'timeout' : (typeof e === 'number' ? e : 'network')); })
          .finally(() => clearTimeout(timer));
      }
      launch();
    });
  }

  // ---- מטמון: האזור מחולק למשבצות של ~2.5 ק"מ; כל משבצת שנטענה נשמרת בטלפון לשבוע ----
  const CELL = 0.025, CELL_TTL = 7 * 24 * 3600 * 1000, CELL_PREFIX = 'trails-v1:';
  const memCells = new Map();
  const shownWays = new Set();

  function cellKey(i, j) { return `${i},${j}`; }
  function cellsFor(bounds) {
    const keys = [];
    for (let i = Math.floor(bounds.getSouth() / CELL); i <= Math.floor(bounds.getNorth() / CELL); i++)
      for (let j = Math.floor(bounds.getWest() / CELL); j <= Math.floor(bounds.getEast() / CELL); j++)
        keys.push(cellKey(i, j));
    return keys;
  }
  function getCell(key) {
    if (memCells.has(key)) return memCells.get(key);
    try {
      const c = JSON.parse(localStorage.getItem(CELL_PREFIX + key));
      if (c && Date.now() - c.t < CELL_TTL) { memCells.set(key, c.ways); return c.ways; }
    } catch (e) {}
    return null;
  }
  function putCell(key, ways) {
    memCells.set(key, ways);
    const data = JSON.stringify({ t: Date.now(), ways });
    for (let attempt = 0; attempt < 2; attempt++) {
      try { localStorage.setItem(CELL_PREFIX + key, data); return; } catch (e) {
        // הזיכרון מלא: מוחקים את המשבצות הישנות
        Object.keys(localStorage).filter(k => k.startsWith(CELL_PREFIX)).forEach(k => localStorage.removeItem(k));
      }
    }
  }

  const trailMsg = L.control({ position: 'bottomleft' });
  trailMsg.onAdd = () => {
    const el = L.DomUtil.create('div', 'trail-msg');
    L.DomEvent.disableClickPropagation(el);
    el.onclick = () => loadTrails(); // לחיצה = נסה שוב
    return el;
  };
  trailMsg.addTo(map);
  function showTrailMsg(text) {
    const el = trailMsg.getContainer();
    el.textContent = text || '';
    el.style.display = text ? 'block' : 'none';
  }

  function trailStyle(tags) {
    const scale = parseInt(tags['mtb:scale'], 10);
    if (!isNaN(scale)) return { color: mtbColors[Math.min(scale, 6)], weight: 5, opacity: 0.9 };
    if (tags.highway === 'track') return { color: '#a16207', weight: 4, opacity: 0.85, dashArray: '8 6' };
    if (tags.highway === 'cycleway') return { color: '#0ea5e9', weight: 4, opacity: 0.8 };
    return { color: '#c2410c', weight: 3, opacity: 0.9, dashArray: '4 5' };
  }

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function trailPopup(id, tags, latlngs) {
    let len = 0;
    for (let i = 1; i < latlngs.length; i++) len += distanceM(latlngs[i - 1], latlngs[i]);
    const scale = parseInt(tags['mtb:scale'], 10);
    const name = tags['name:he'] || tags.name;
    const [lat, lon] = latlngs[Math.floor(latlngs.length / 2)];
    const links = [
      `<a href="https://www.google.com/maps/@?api=1&map_action=map&center=${lat},${lon}&zoom=18&basemap=satellite" target="_blank">🛰️ לוויין בגוגל</a>`,
      name ? `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' אופניים')}" target="_blank">🎥 סרטונים</a>` : '',
      `<a href="https://www.mapillary.com/app/?lat=${lat}&lng=${lon}&z=17" target="_blank">📷 Mapillary</a>`,
      `<a href="https://www.openstreetmap.org/way/${id}" target="_blank">ℹ️ מקור</a>`
    ];
    const rows = [
      `<b>${esc(name || highwayNames[tags.highway] || 'שביל')}</b>`,
      `סוג: ${esc(highwayNames[tags.highway] || tags.highway || 'מסלול')}`,
      !isNaN(scale) ? `קושי MTB: <span style="color:${mtbColors[Math.min(scale, 6)]}">●</span> ${mtbNames[Math.min(scale, 6)]} (S${scale})` : '',
      tags.surface ? `משטח: ${esc(surfaceNames[tags.surface] || tags.surface)}` : '',
      tags.tracktype ? `איכות דרך: ${esc(tags.tracktype.replace('grade', ''))}/5` : '',
      tags.bicycle === 'no' ? '🚫 אסור לאופניים' : '',
      `אורך: ${len >= 1000 ? (len / 1000).toFixed(1) + ' ק״מ' : Math.round(len) + ' מ׳'}`,
      links.filter(Boolean).join(' · ')
    ];
    return `<div class="trail-popup">${rows.filter(Boolean).join('<br>')}` +
      '<div class="trail-sat"></div><div class="trail-photos">📷 מחפש תמונות מהאזור...</div></div>';
  }

  // ---- תצוגה מקדימה: המסלול מצויר על תמונת לוויין, ותמונות שצולמו בסביבה ----
  const photoCache = new Map();

  async function nearbyPhotos(lat, lon, tags) {
    const key = `${lat.toFixed(3)},${lon.toFixed(3)}`;
    if (photoCache.has(key)) return photoCache.get(key);
    const photos = [];
    if (tags.image && /^https:/.test(tags.image)) photos.push({ thumb: tags.image, page: tags.image });
    const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
      `&generator=geosearch&ggscoord=${lat}|${lon}&ggsradius=2000&ggslimit=15&ggsnamespace=6` +
      '&prop=imageinfo&iiprop=url|mime&iiurlwidth=320';
    const d = await (await fetch(url)).json();
    const pages = Object.values((d.query && d.query.pages) || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
    for (const pg of pages) {
      const ii = pg.imageinfo && pg.imageinfo[0];
      if (ii && /^image\/(jpeg|png|webp)/.test(ii.mime)) photos.push({ thumb: ii.thumburl, page: ii.descriptionurl });
    }
    photoCache.set(key, photos);
    return photos;
  }

  // התוכן נבנה פעם אחת כאלמנט קבוע, כדי ש-Leaflet לא ידרוס את התצוגה המקדימה כשהוא מרענן את החלון
  const popupEls = new Map();
  function popupElement(id, tags, latlngs) {
    if (!popupEls.has(id)) {
      const el = document.createElement('div');
      el.innerHTML = trailPopup(id, tags, latlngs);
      popupEls.set(id, el);
    }
    return popupEls.get(id);
  }

  function openPreview(e, tags, latlngs) {
    const root = e.popup.getElement();
    if (!root) return;
    const satEl = root.querySelector('.trail-sat');
    if (satEl && !satEl._map) {
      const mini = L.map(satEl, {
        zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
        doubleClickZoom: false, touchZoom: false, boxZoom: false, keyboard: false
      });
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(mini);
      L.polyline(latlngs, { color: '#facc15', weight: 4, opacity: 0.95 }).addTo(mini);
      mini.fitBounds(latlngs, { padding: [12, 12], maxZoom: 18 });
      satEl._map = mini;
      satEl.onclick = () => window.open(`https://www.google.com/maps/@?api=1&map_action=map&center=${latlngs[Math.floor(latlngs.length / 2)].join(',')}&zoom=18&basemap=satellite`, '_blank');
      e.popup.once('remove', () => { mini.remove(); satEl._map = null; });
    }
    const photosEl = root.querySelector('.trail-photos');
    const [lat, lon] = latlngs[Math.floor(latlngs.length / 2)];
    nearbyPhotos(lat, lon, tags).then(photos => {
      if (!photosEl.isConnected) return;
      photosEl.innerHTML = photos.length
        ? photos.map(p => `<a href="${esc(p.page)}" target="_blank"><img src="${esc(p.thumb)}" loading="lazy" alt=""></a>`).join('')
        : 'אין תמונות מהאזור. נסה את הקישור ל־Mapillary';
      e.popup.update();
    }).catch(() => { if (photosEl.isConnected) photosEl.textContent = 'לא הצלחתי לטעון תמונות'; });
  }

  function drawWays(ways) {
    for (const [id, tags, latlngs] of ways) {
      if (shownWays.has(id)) continue;
      shownWays.add(id);
      L.polyline(latlngs, trailStyle(tags))
        .bindPopup(() => popupElement(id, tags, latlngs), { autoPanPaddingTopLeft: [20, 120], minWidth: 250, maxWidth: 270 })
        .on('popupopen', e => openPreview(e, tags, latlngs))
        .addTo(trails);
    }
  }

  async function loadTrails() {
    if (!map.hasLayer(trails)) return showTrailMsg('');
    if (map.getZoom() < TRAIL_MIN_ZOOM) return showTrailMsg('🔍 התקרב כדי לראות שבילי שטח');
    const keys = cellsFor(map.getBounds());
    const missing = [];
    for (const k of keys) {
      const ways = getCell(k);
      if (ways) drawWays(ways); else missing.push(k);
    }
    if (!missing.length) return showTrailMsg('');

    const gen = ++trailsGen;
    showTrailMsg('⏳ טוען שבילים...');
    const ij = missing.map(k => k.split(',').map(Number));
    const s = Math.min(...ij.map(c => c[0])) * CELL, n = (Math.max(...ij.map(c => c[0])) + 1) * CELL;
    const w = Math.min(...ij.map(c => c[1])) * CELL, e = (Math.max(...ij.map(c => c[1])) + 1) * CELL;
    const bbox = [s, w, n, e].map(x => x.toFixed(4)).join(',');
    const query = `[out:json][timeout:25][bbox:${bbox}];(way["highway"~"^(path|track|bridleway)$"];way["highway"="cycleway"]["mtb:scale"];);out tags geom qt;`;
    try {
      const d = await overpass(query);
      // מחלקים את התוצאה למשבצות ושומרים כל אחת
      const byCell = new Map(missing.map(k => [k, []]));
      for (const el of d.elements) {
        if (!el.geometry) continue;
        const latlngs = el.geometry.map(g => [+g.lat.toFixed(6), +g.lon.toFixed(6)]);
        const way = [el.id, el.tags || {}, latlngs];
        const touched = new Set(latlngs.map(([la, lo]) => cellKey(Math.floor(la / CELL), Math.floor(lo / CELL))));
        for (const k of touched) if (byCell.has(k)) byCell.get(k).push(way);
      }
      for (const [k, ways] of byCell) putCell(k, ways);
      drawWays([...byCell.values()].flat());
      if (gen === trailsGen) showTrailMsg(d.elements.length || shownWays.size ? '' : 'אין שבילים מסומנים באזור הזה');
    } catch (err) {
      if (gen === trailsGen) showTrailMsg(`⚠️ לא הצלחתי לטעון שבילים (${err.message}). לחץ כאן לנסות שוב`);
    }
  }
  function scheduleTrails() {
    clearTimeout(trailsTimer);
    trailsTimer = setTimeout(loadTrails, 700);
  }
  map.on('moveend overlayadd overlayremove', scheduleTrails);

  // ---- חיפוש מקום (כמו בגוגל מפות) ----
  const SearchControl = L.Control.extend({
    options: { position: 'topright' },
    onAdd() {
      const form = L.DomUtil.create('form', 'search-box');
      form.innerHTML = '<input type="search" placeholder="חפש מקום, יער, שביל..." enterkeyhint="search"><button type="submit">🔍</button>';
      L.DomEvent.disableClickPropagation(form);
      L.DomEvent.disableScrollPropagation(form);
      form.onsubmit = async e => {
        e.preventDefault();
        const input = form.querySelector('input');
        const q = input.value.trim();
        if (!q) return;
        input.blur();
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=he&q=${encodeURIComponent(q)}`);
          const [hit] = await r.json();
          if (!hit) { showTrailMsg('לא נמצא מקום בשם הזה'); return; }
          setFollow(false);
          if (hit.boundingbox) {
            const [s, n, w, e2] = hit.boundingbox.map(Number);
            map.fitBounds([[s, w], [n, e2]], { maxZoom: 15 });
            if (map.getZoom() < TRAIL_MIN_ZOOM) map.setZoom(TRAIL_MIN_ZOOM); // כדי שהשבילים יופיעו מיד
          } else {
            map.setView([+hit.lat, +hit.lon], 15);
          }
        } catch (err) {
          showTrailMsg('⚠️ החיפוש נכשל');
        }
      };
      return form;
    }
  });
  new SearchControl().addTo(map);

  // ---- מסך מלא למפה ----
  const FullControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const el = L.DomUtil.create('div', 'leaflet-bar locate-btn');
      el.textContent = '⛶';
      el.title = 'מפה במסך מלא';
      L.DomEvent.disableClickPropagation(el);
      el.onclick = () => {
        document.body.classList.toggle('maponly');
        el.classList.toggle('active');
        map.invalidateSize();
      };
      return el;
    }
  });

  // המפה עוקבת אחרי המיקום עד שמזיזים אותה ביד; הכפתור 📍 מחזיר את המעקב
  let follow = true, lastLatLng = null;
  const LocateControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const el = L.DomUtil.create('div', 'leaflet-bar locate-btn active');
      el.textContent = '📍';
      el.title = 'חזור למיקום שלי';
      L.DomEvent.disableClickPropagation(el);
      el.onclick = () => {
        setFollow(true);
        if (lastLatLng) map.setView(lastLatLng, Math.max(map.getZoom(), 16));
      };
      return el;
    }
  });
  const locateCtl = new LocateControl().addTo(map);
  new FullControl().addTo(map);
  function setFollow(v) {
    follow = v;
    locateCtl.getContainer().classList.toggle('active', v);
  }
  map.on('dragstart', () => setFollow(false));

  let marker = null, circle = null, firstFix = true;
  let lastWeatherTime = 0, lastGeoTime = 0;

  const $ = id => document.getElementById(id);

  async function updateWeather(lat, lon) {
    if (Date.now() - lastWeatherTime < 60000) return; // פעם בדקה
    lastWeatherTime = Date.now();
    try {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`);
      const d = await r.json();
      $('temp').textContent = Math.round(d.current.temperature_2m) + '°C';
    } catch (e) {
      $('temp').textContent = 'שגיאה';
    }
  }

  async function updatePlace(lat, lon) {
    if (Date.now() - lastGeoTime < 30000) return; // פעם ב-30 שניות
    lastGeoTime = Date.now();
    try {
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=he`);
      const d = await r.json();
      const parts = [d.locality || d.city, d.countryName].filter(Boolean);
      $('place').textContent = parts.join(', ') || 'לא ידוע';
    } catch (e) {
      $('place').textContent = 'לא ניתן לאתר כתובת';
    }
  }

  function onPosition(pos) {
    const { latitude: lat, longitude: lon, accuracy } = pos.coords;
    $('status').style.display = 'none';
    $('coords').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    $('acc').textContent = `±${Math.round(accuracy)} מ׳`;

    if (!marker) {
      marker = L.marker([lat, lon]).addTo(map);
      circle = L.circle([lat, lon], { radius: accuracy, color: '#38bdf8', fillOpacity: 0.15, interactive: false }).addTo(map);
    } else {
      marker.setLatLng([lat, lon]);
      circle.setLatLng([lat, lon]).setRadius(accuracy);
    }
    lastLatLng = [lat, lon];
    if (firstFix) { map.setView([lat, lon], 16); firstFix = false; }
    else if (follow) { map.panTo([lat, lon]); }

    addRidePoint(lat, lon, accuracy, pos.coords.speed, pos.timestamp);
    updateWeather(lat, lon);
    updatePlace(lat, lon);
  }

  function onError(err) {
    const msgs = {
      1: 'הגישה למיקום נחסמה. אשר מיקום בהגדרות הדפדפן.',
      2: 'לא ניתן לקבוע מיקום.',
      3: 'הבקשה למיקום נתקעה, מנסה שוב...'
    };
    $('status').style.display = 'block';
    $('status').textContent = msgs[err.code] || 'שגיאה במיקום';
  }

  // ---- רכיבה: מרחק, זמן ומהירות. נשמר בדפדפן כדי לשרוד סגירה של האפליקציה ----
  const RIDE_KEY = 'where-am-i-ride';
  let ride = null, wakeLock = null;
  const ridePath = L.polyline([], { color: '#f97316', weight: 5, opacity: 0.9, interactive: false }).addTo(map);

  function loadRide() {
    try { return JSON.parse(localStorage.getItem(RIDE_KEY)); } catch (e) { return null; }
  }
  function saveRide() {
    try { localStorage.setItem(RIDE_KEY, JSON.stringify(ride)); } catch (e) {}
  }

  function distanceM(a, b) {
    const R = 6371000, toRad = x => x * Math.PI / 180;
    const dLat = toRad(b[0] - a[0]), dLon = toRad(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a[0])) * Math.cos(toRad(b[0])) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function addRidePoint(lat, lon, accuracy, speed, time) {
    if (!ride || !ride.active) return;
    $('rSpeed').textContent = speed != null && speed >= 0 ? Math.round(speed * 3.6) : '-';
    if (accuracy > 35) return; // מדידה לא מדויקת מדי
    const pt = [lat, lon];
    const last = ride.points[ride.points.length - 1];
    if (last) {
      const d = distanceM(last, pt);
      if (d < Math.max(4, accuracy / 2)) return; // רעידות של GPS כשעומדים במקום
      ride.distance += d;
    }
    ride.points.push(pt);
    ridePath.addLatLng(pt);
    saveRide();
    renderRide();
  }

  function fmtTime(ms) {
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
  }

  function renderRide() {
    if (!ride) return;
    const elapsed = (ride.active ? Date.now() : ride.end) - ride.start;
    $('rDist').textContent = (ride.distance / 1000).toFixed(2);
    $('rTime').textContent = fmtTime(elapsed);
    $('rAvg').textContent = elapsed > 0 ? Math.round(ride.distance / 1000 / (elapsed / 3600000)) : 0;
  }

  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && ride && ride.active && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', keepAwake);

  function setRideUI() {
    const active = ride && ride.active;
    $('rideBtn').textContent = active ? '⏹ עצור' : '🚴 התחל רכיבה';
    $('rideBtn').classList.toggle('on', !!active);
    $('rideStats').classList.toggle('show', !!ride);
    $('rideNote').style.display = active ? 'block' : 'none';
  }

  $('rideBtn').onclick = () => {
    if (ride && ride.active) {
      ride.active = false;
      ride.end = Date.now();
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
    } else {
      ride = { active: true, start: Date.now(), end: null, distance: 0, points: [] };
      ridePath.setLatLngs([]);
      $('rSpeed').textContent = '0';
      keepAwake();
    }
    saveRide();
    setRideUI();
    renderRide();
  };

  ride = loadRide();
  if (ride) {
    ridePath.setLatLngs(ride.points);
    if (ride.active) keepAwake();
  }
  setRideUI();
  renderRide();
  setInterval(() => { if (ride && ride.active) renderRide(); }, 1000);

  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true, maximumAge: 0, timeout: 15000
    });
  } else {
    $('status').textContent = 'הדפדפן לא תומך במיקום.';
  }
</script>
</body>
</html>
